services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: broker
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://broker:${POSTGRES_PASSWORD}@db:5432/broker
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TIMEZONE: Europe/Madrid
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Solo accesible desde el propio servidor (p. ej. por túnel SSH para
      # depurar con /docs); nunca se abre al exterior. De cara al público
      # solo responde "frontend" (Caddy), que es quien le reenvía /api/*.
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
